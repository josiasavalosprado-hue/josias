<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerreiros da Mente | Dragon Ball & Piratas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dbz-orange: #FF6B00;
            --dbz-blue: #0041B5;
            --dbz-yellow: #FFD700;
            --bg-dark: #0a0a1a;
            --card-bg: rgba(20, 20, 45, 0.9);
            --text-light: #ffffff;
            --pirate-gold: #ffcc00;
            --aura-glow: 0 0 20px rgba(255, 107, 0, 0.6);
        }

        .dark-mode {
            --bg-dark: #000000;
            --card-bg: rgba(10, 10, 25, 0.95);
            --dbz-orange: #cc5500;
            --aura-glow: 0 0 30px rgba(0, 65, 181, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            /* Fundo com estrelas e Ki */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 107, 0, 0.1), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 65, 181, 0.15), transparent 40%),
                url('https://www.transparenttextures.com/patterns/stardust.png');
            background-attachment: fixed;
            transition: all 0.4s ease;
        }

        /* HEADER ESTILO ANIME */
        header {
            background: linear-gradient(90deg, var(--dbz-blue), #001d52);
            border-bottom: 5px solid var(--dbz-orange);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        .logo {
            font-family: 'Bangers', cursive;
            font-size: 2.2rem;
            color: var(--dbz-yellow);
            letter-spacing: 3px;
            text-shadow: 3px 3px 0px #000, -1px -1px 0px var(--dbz-orange);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 900;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--dbz-yellow);
            border-color: var(--dbz-orange);
            background: rgba(255, 107, 0, 0.1);
        }

        .accessibility-controls button {
            background: var(--dbz-yellow);
            border: 2px solid #000;
            color: #000;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 50%;
            font-weight: bold;
            font-family: 'Bangers', cursive;
        }

        /* MAIN CONTENT */
        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        section {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 3rem;
            margin-bottom: 3rem;
            border: 4px solid var(--dbz-blue);
            position: relative;
            box-shadow: var(--aura-glow);
        }

        /* ADESIVOS (DRAGON BALLS) */
        .sticker-db {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #ffcc00, #ff8800);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #cc0000;
            font-size: 1.5rem;
            border: 2px solid #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .db-1 { top: -35px; right: 20px; }
        .db-2 { bottom: -35px; left: 20px; }

        h2 {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            color: var(--dbz-orange);
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 0px #000;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* HERO SECTION */
        .hero {
            display: flex;
            align-items: center;
            gap: 2rem;
            border-color: var(--dbz-orange);
        }

        .hero-text h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: var(--dbz-yellow);
            line-height: 1;
            margin-bottom: 1.5rem;
            text-shadow: 4px 4px 0px #000;
        }

        .hero-img img {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            border: 5px solid var(--dbz-blue);
            box-shadow: 0 0 30px var(--dbz-blue);
        }

        /* TREINO DE KI (CONEXÃO) */
        .ki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .ki-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 2rem;
            border-radius: 20px;
            border-left: 8px solid var(--dbz-yellow);
            transition: 0.3s;
        }

        .ki-card:hover {
            transform: scale(1.05);
            background: rgba(255, 107, 0, 0.1);
            box-shadow: 0 0 20px var(--dbz-orange);
        }

        .ki-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--dbz-yellow);
            margin-bottom: 1rem;
        }

        /* MURAL DO MESTRE KAME */
        .mural-area {
            background: url('https://www.transparenttextures.com/patterns/paper-fibers.png'), #f4d03f;
            padding: 2rem;
            border-radius: 15px;
            border: 4px solid #8e44
